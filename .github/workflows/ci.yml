name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never index a CI build, and never let a missing key fall back to something weak.
  NEXT_PUBLIC_SITE_INDEXABLE: "false"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Route check
        run: pnpm run test:routes

  business-facts:
    name: No hardcoded business facts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          # This job runs plain Node against the checked-out tree and installs
          # nothing, so there is no package manager for setup-node to cache.
          package-manager-cache: false

      # The gate is only worth having if it still catches a violation, so the check
      # proves itself against known-bad samples before it is trusted on the tree.
      - name: Self-test the detector
        run: node scripts/check-business-facts.mjs --selftest

      - name: Scan the tree
        run: node scripts/check-business-facts.mjs
