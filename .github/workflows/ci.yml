name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never index a CI build, and never let a missing key fall back to something weak.
  NEXT_PUBLIC_SITE_INDEXABLE: "false"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Route check
        run: pnpm run test:routes

  business-facts:
    name: No hardcoded business facts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          # This job runs plain Node against the checked-out tree and installs
          # nothing, so there is no package manager for setup-node to cache.
          package-manager-cache: false

      # The gate is only worth having if it still catches a violation, so the check
      # proves itself against known-bad samples before it is trusted on the tree.
      - name: Self-test the detector
        run: node scripts/check-business-facts.mjs --selftest

      - name: Scan the tree
        run: node scripts/check-business-facts.mjs

  lighthouse:
    name: Performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The budget *measurement* reports rather than gates, for now. The app does
    # not yet meet three of the four budgets in AGENTS.md §2 — measured
    # 2026-09-03 on the home page: LCP 4.2s against 2.5s, total blocking time
    # 1.2s against 200ms, and 180KB of script against 120KB. Making that a
    # required check before the work that fixes it would put main permanently
    # red, which teaches everyone to ignore CI. The thresholds in
    # lighthouserc.json are the real ones and are not to be loosened; the
    # numbers are collected on every run so the trend is visible, and the flag
    # comes off the Lighthouse step when the budgets are met. See work-plan.md §4.
    #
    # `continue-on-error` is on that step alone, not on the job. It used to be on
    # the job, and that is how a broken migration hid: this is the only job that
    # runs `db:migrate` against a real CockroachDB, and it was also the only job
    # permitted to fail. Since 0008_admin_search.sql landed on 2026-09-01 it died
    # at Migrate on every run, reached Lighthouse zero times, and still reported
    # green — across 60 commits on main. A step that cannot measure a budget is
    # not the same as a budget that is not met.

    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      # A real database, because the storefront renders from one. Without it the
      # only measurable page is /track, and a budget that only ever sees one page
      # with no catalogue on it is not measuring what customers load. Insecure
      # single-node is right here: it lives for the length of the job and holds
      # nothing but an empty schema.
      - name: Start CockroachDB
        run: |
          docker run -d --name crdb -p 26257:26257             cockroachdb/cockroach:latest-v24.1 start-single-node --insecure
          for i in $(seq 1 60); do
            if docker exec crdb ./cockroach sql --insecure -e "SELECT 1" >/dev/null 2>&1; then
              echo "cockroach ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "CockroachDB did not become ready"
          docker logs crdb
          exit 1

      - name: Install
        run: pnpm install --frozen-lockfile

      # Twice, deliberately. A migration file is not atomic — the runner sends one
      # statement per round trip, because CockroachDB rejects a write to a table
      # a schema change in the same transaction is still adding — so a failure
      # part-way through a file replays the statements before it on the next run.
      # The second pass is what proves every statement survives that: it must
      # apply nothing and report the whole set already recorded.
      - name: Migrate
        run: |
          pnpm run db:migrate
          echo "--- second pass: every statement must be safe to replay ---"
          pnpm run db:migrate | tee second-pass.log
          grep -q "Nothing to apply" second-pass.log
        env:
          DATABASE_URL: postgresql://root@127.0.0.1:26257/defaultdb?sslmode=disable

      - name: Build
        run: pnpm run build
        env:
          DATABASE_URL: postgresql://root@127.0.0.1:26257/defaultdb?sslmode=disable
          AUTH_SECRET: ci-only-never-used-to-sign-anything-real

      - name: Lighthouse
        run: |
          pnpm --filter @pv/frontend exec next start -p 3131 &
          # A curl loop rather than a wait-on dependency: one fewer package to
          # install, and it fails with the reason rather than a generic timeout.
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null http://127.0.0.1:3131/track; then
              echo "server ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:3131/track
          npx lhci autorun
        continue-on-error: true
        env:
          DATABASE_URL: postgresql://root@127.0.0.1:26257/defaultdb?sslmode=disable
          AUTH_SECRET: ci-only-never-used-to-sign-anything-real

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14
